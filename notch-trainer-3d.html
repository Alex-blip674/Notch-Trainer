<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOTCH // 3-Axis Intercept Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070a;
    --panel:#070d11;
    --panel-2:#0b141a;
    --line-dim:#17302c;
    --line-dim2:#0e2119;
    --player:#3fc8ff;
    --player-dim:#153a4a;
    --missile:#ff4d4d;
    --missile-dim:#4a1414;
    --good:#39ffb0;
    --bad:#ff9d3f;
    --text:#d7f5ec;
    --text-dim:#5c8079;
    --text-dim2:#3a5852;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Rajdhani',sans-serif;overscroll-behavior:none;}
  body{position:fixed;inset:0;}
  #shell{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;width:100dvw;overscroll-behavior:none;}

  /* ---------- viewport ---------- */
  #viewport{position:relative;flex:1 1 auto;min-height:260px;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 40%, #0a1418 0%, #04070a 70%);}
  #sweep{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background:conic-gradient(from 0deg, var(--player) 0deg, transparent 18deg, transparent 360deg);
    animation:spin 14s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  canvas#gl{position:absolute;inset:0;display:block;touch-action:none;}

  .corner{position:absolute;width:22px;height:22px;border-color:var(--line-dim);opacity:.9;pointer-events:none;}
  .corner.tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid;}
  .corner.tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid;}
  .corner.bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid;}
  .corner.br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid;}

  #titleblock{position:absolute;top:14px;left:20px;pointer-events:none;}
  #titleblock .eyebrow{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.25em;color:var(--text-dim);}
  #titleblock h1{margin:2px 0 0;font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--text);text-transform:uppercase;}

  #legend{position:absolute;top:14px;right:20px;text-align:right;pointer-events:none;
    font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.05em;}
  #legend div{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:4px;}
  #legend .dot{width:8px;height:8px;border-radius:50%;}

  #hint{position:absolute;bottom:12px;left:20px;font-family:'Share Tech Mono',monospace;
    font-size:9px;color:var(--text-dim2);letter-spacing:.05em;pointer-events:none;}

  #ruleline{position:absolute;bottom:12px;right:20px;max-width:46%;text-align:right;
    font-family:'Share Tech Mono',monospace;font-size:9.5px;line-height:1.5;color:var(--text-dim);pointer-events:none;}
  #ruleline b{color:var(--good);font-weight:400;}

  /* ---------- control panel ---------- */
  #panel{flex:0 0 auto;max-height:46vh;overflow-y:auto;background:var(--panel);
    border-top:1px solid var(--line-dim);padding:14px 16px 22px;}
  #panel::-webkit-scrollbar{width:6px;}
  #panel::-webkit-scrollbar-thumb{background:var(--line-dim);}

  .section-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.2em;
    color:var(--text-dim);margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
  .section-label:first-child{margin-top:0;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--line-dim);}

  .presets{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:.03em;
    background:var(--panel-2);color:var(--text);border:1px solid var(--line-dim);
    padding:8px 10px;border-radius:2px;cursor:pointer;text-transform:uppercase;flex:1 1 auto;
    transition:border-color .15s, color .15s;}
  .btn:hover{border-color:var(--player);color:var(--player);}
  .btn:active{transform:translateY(1px);}
  .btn.mini{flex:none;padding:5px 8px;font-size:10px;}

  .row{display:flex;align-items:center;gap:10px;margin:9px 0;}
  .row label{font-size:12px;color:var(--text-dim);min-width:64px;letter-spacing:.03em;}
  .row input[type=range]{flex:1;accent-color:var(--player);height:3px;}
  .row .val{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);min-width:40px;text-align:right;}

  .block{background:var(--panel-2);border:1px solid var(--line-dim2);border-left:2px solid var(--m-color, var(--missile));
    border-radius:2px;padding:10px 12px;margin-bottom:10px;}
  .block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .block-head .name{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--text);text-transform:uppercase;}
  .switch{display:flex;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);}
  .switch input{accent-color:var(--missile);}

  .block-body{display:flex;gap:12px;align-items:center;}
  .block-controls{flex:1;min-width:0;}
  .gauge-wrap{flex:none;width:104px;text-align:center;}
  .gauge-wrap canvas{width:100px;height:64px;display:block;margin:0 auto;}
  .gauge-status{font-family:'Share Tech Mono',monospace;font-size:10px;margin-top:2px;letter-spacing:.06em;}
  .gauge-value{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);}

  .planetoggle{display:flex;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--text-dim);margin-top:6px;}
  .planetoggle input{accent-color:var(--good);}

  .count-badge{font-size:9px;color:var(--text-dim2);}
  .del-btn{background:transparent;border:1px solid var(--line-dim2);color:var(--text-dim);
    width:20px;height:20px;line-height:1;border-radius:2px;cursor:pointer;font-size:11px;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;}
  .del-btn:hover{border-color:var(--missile);color:var(--missile);}
  #addMissileBtn:disabled{opacity:.35;cursor:not-allowed;}
  #addMissileBtn:disabled:hover{border-color:var(--line-dim);color:var(--text);}

  /* ---------- desktop / PC optimization ---------- */
  @media (min-width:900px){
    #shell{flex-direction:row;}
    #viewport{flex:1;cursor:grab;}
    #viewport.dragging{cursor:grabbing;}
    #panel{flex:0 0 420px;max-height:100vh;border-top:none;border-left:1px solid var(--line-dim);padding:22px 24px 32px;}
    #titleblock h1{font-size:19px;}
    #titleblock .eyebrow{font-size:11px;}
    #legend{font-size:11px;}
    #ruleline{font-size:11px;max-width:40%;}
    #hint{font-size:10px;}
    .section-label{font-size:11px;margin:20px 0 10px;}
    .btn{font-size:13px;padding:10px 12px;}
    .row label{font-size:13px;}
    .row .val{font-size:12px;}
    .block{padding:14px 16px;margin-bottom:14px;}
    .block-head .name{font-size:14px;}
    .gauge-wrap{width:116px;}
    .gauge-wrap canvas{width:112px;height:72px;}
  }
  @media (min-width:1300px){
    #panel{flex-basis:460px;}
  }
</style>
</head>
<body>
<div id="shell">
  <div id="viewport">
    <div id="sweep"></div>
    <canvas id="gl"></canvas>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="titleblock">
      <div class="eyebrow">THREAT GEOMETRY // TRAINER</div>
      <h1>Missile Notch — 3-Axis</h1>
    </div>
    <div id="legend">
      <div><span>AIRCRAFT (YOU)</span><span class="dot" style="background:var(--player)"></span></div>
      <div><span>AIM-120 LOS</span><span class="dot" style="background:var(--missile)"></span></div>
    </div>
    <div id="hint">DRAG TO ORBIT · SCROLL OR PINCH TO ZOOM</div>
    <div id="ruleline">A <b>90° NOTCH</b> makes the missile's radar struggle to<br>differentiate you from chaff or terrain, depending on scenario.</div>
  </div>

  <div id="panel">
    <div class="section-label">PRESETS</div>
    <div class="presets">
      <button class="btn" id="preset1">Diagonal A</button>
      <button class="btn" id="preset2">Diagonal B</button>
      <button class="btn" id="preset3">Vertical Notch</button>
    </div>

    <div class="section-label">AIRCRAFT HEADING</div>
    <div class="row">
      <label>Azimuth</label>
      <input type="range" id="pAz" min="-180" max="180" value="45" step="1">
      <span class="val" id="pAzVal">45°</span>
    </div>
    <div class="row">
      <label>Elevation</label>
      <input type="range" id="pEl" min="-89" max="89" value="0" step="1">
      <span class="val" id="pElVal">0°</span>
    </div>

    <div class="section-label">THREATS <span id="threatCount" class="count-badge">3 / 8</span></div>
    <button class="btn" id="addMissileBtn" style="margin-bottom:10px;">+ Add Threat</button>
    <div id="missileBlocks"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------------- three.js base setup ----------------
  const canvas = document.getElementById('gl');
  const viewport = document.getElementById('viewport');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setClearColor(0x04070a, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

  function resize(){
    const w = viewport.clientWidth, h = viewport.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=>setTimeout(resize,50));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
  }
  if(window.ResizeObserver){
    new ResizeObserver(resize).observe(viewport);
  }

  // lights (subtle, mostly for arrowhead cone shading)
  scene.add(new THREE.AmbientLight(0x8fbfb5, 0.9));
  const dl = new THREE.DirectionalLight(0xffffff, 0.5);
  dl.position.set(3,4,5);
  scene.add(dl);

  // ---------------- manual orbit camera ----------------
  let camAz = 0.9, camEl = 0.5, camDist = 10.5;
  function updateCamera(){
    const x = camDist*Math.cos(camEl)*Math.cos(camAz);
    const y = camDist*Math.cos(camEl)*Math.sin(camAz);
    const z = camDist*Math.sin(camEl);
    camera.position.set(x,y,z);
    camera.up.set(0,0,1);
    camera.lookAt(0,0,0);
  }
  let dragging=false, lastX=0, lastY=0;
  function pointerDown(x,y){dragging=true;lastX=x;lastY=y;viewport.classList.add('dragging');}
  function pointerMove(x,y){
    if(!dragging) return;
    const dx=x-lastX, dy=y-lastY; lastX=x;lastY=y;
    camAz -= dx*0.006;
    camEl = Math.max(-1.4, Math.min(1.4, camEl + dy*0.006));
    updateCamera();
  }
  function pointerUp(){dragging=false;viewport.classList.remove('dragging');}
  function zoomBy(delta){
    camDist = Math.max(4, Math.min(24, camDist + delta));
    updateCamera();
  }
  canvas.addEventListener('mousedown', e=>pointerDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>pointerMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('wheel', e=>{
    zoomBy(e.deltaY*0.01);
    e.preventDefault();
  },{passive:false});

  // touch: one finger orbits, two fingers pinch-zoom (and pan-drag the midpoint)
  let pinchStartDist = null, pinchStartCamDist = 10.5;
  function touchDist(t0,t1){
    const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY;
    return Math.hypot(dx,dy);
  }
  canvas.addEventListener('touchstart', e=>{
    if(e.touches.length === 2){
      dragging = false;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartCamDist = camDist;
    } else if(e.touches.length === 1){
      pinchStartDist = null;
      const t = e.touches[0];
      pointerDown(t.clientX, t.clientY);
    }
  }, {passive:true});
  canvas.addEventListener('touchmove', e=>{
    if(e.touches.length === 2 && pinchStartDist){
      const d = touchDist(e.touches[0], e.touches[1]);
      const scale = pinchStartDist / Math.max(d, 1);
      camDist = Math.max(4, Math.min(24, pinchStartCamDist * scale));
      updateCamera();
    } else if(e.touches.length === 1 && dragging){
      const t = e.touches[0];
      pointerMove(t.clientX, t.clientY);
    }
    e.preventDefault();
  }, {passive:false});
  canvas.addEventListener('touchend', e=>{
    if(e.touches.length < 2) pinchStartDist = null;
    if(e.touches.length === 0) pointerUp();
  });
  canvas.addEventListener('touchcancel', ()=>{ pinchStartDist=null; pointerUp(); });

  // ---------------- helpers ----------------
  function sphToVec(azDeg, elDeg){
    const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
    return new THREE.Vector3(Math.cos(el)*Math.cos(az), Math.cos(el)*Math.sin(az), Math.sin(el)).normalize();
  }
  function vecToSph(v){
    const el = THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(v.z,-1,1)));
    const az = THREE.MathUtils.radToDeg(Math.atan2(v.y, v.x));
    return {az, el};
  }
  function makeLabel(text, color){
    const c = document.createElement('canvas'); c.width=128;c.height=128;
    const ctx = c.getContext('2d');
    ctx.font = '700 66px Rajdhani, sans-serif';
    ctx.fillStyle = color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text,64,68);
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
    const spr = new THREE.Sprite(mat);
    spr.scale.set(0.55,0.55,0.55);
    spr.renderOrder = 10;
    return spr;
  }

  // ---------------- axes ----------------
  const AXLEN = 5.2;
  function addAxisLine(dir, color){
    const pts = [dir.clone().multiplyScalar(-AXLEN), dir.clone().multiplyScalar(AXLEN)];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({color, transparent:true, opacity:0.55});
    scene.add(new THREE.Line(geo, mat));
  }
  addAxisLine(new THREE.Vector3(1,0,0), 0x2a4a44);
  addAxisLine(new THREE.Vector3(0,1,0), 0x2a4a44);
  addAxisLine(new THREE.Vector3(0,0,1), 0x2a4a44);
  const lblX = makeLabel('X','#7fb8ae'); lblX.position.set(AXLEN+0.5,0,0); scene.add(lblX);
  const lblY = makeLabel('Y','#7fb8ae'); lblY.position.set(0,AXLEN+0.5,0); scene.add(lblY);
  const lblZ = makeLabel('Z','#7fb8ae'); lblZ.position.set(0,0,AXLEN+0.5); scene.add(lblZ);

  // faint polar grid on the horizontal (xy) plane for depth reference
  const polar = new THREE.PolarGridHelper(5, 8, 6, 48, 0x122824, 0x0d1e1a);
  polar.rotation.x = Math.PI/2;
  polar.material.transparent = true;
  polar.material.opacity = 0.35;
  scene.add(polar);

  // ---------------- low-poly model builders ----------------
  // All models are built nose-first along local +X, so aligning +X to a
  // direction vector points the model the right way.
  function triMesh(p1,p2,p3, color, opts){
    const geo = new THREE.BufferGeometry();
    const verts = new Float32Array([...p1, ...p2, ...p3]);
    geo.setAttribute('position', new THREE.BufferAttribute(verts,3));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial(Object.assign({color, side:THREE.DoubleSide, metalness:0.3, roughness:0.55}, opts||{}));
    return new THREE.Mesh(geo, mat);
  }
  function quadMesh(p1,p2,p3,p4, color, opts){
    // p1..p4 wound in order around the quad; rendered as two triangles.
    const geo = new THREE.BufferGeometry();
    const verts = new Float32Array([...p1,...p2,...p3, ...p1,...p3,...p4]);
    geo.setAttribute('position', new THREE.BufferAttribute(verts,3));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial(Object.assign({color, side:THREE.DoubleSide, metalness:0.3, roughness:0.55}, opts||{}));
    return new THREE.Mesh(geo, mat);
  }
  function cyl(rTop,rBot,len,color,opts){
    const geo = new THREE.CylinderGeometry(rTop,rBot,len,10);
    const mat = new THREE.MeshStandardMaterial(Object.assign({color, metalness:0.4, roughness:0.5}, opts||{}));
    const m = new THREE.Mesh(geo, mat);
    m.rotation.z = -Math.PI/2; // align cylinder axis (default Y) to local X
    return m;
  }
  function cone(r,len,color,opts){
    const geo = new THREE.ConeGeometry(r,len,10);
    const mat = new THREE.MeshStandardMaterial(Object.assign({color, metalness:0.4, roughness:0.5}, opts||{}));
    const m = new THREE.Mesh(geo, mat);
    m.rotation.z = -Math.PI/2;
    return m;
  }

  function centerGroup(g, scale){
    // shifts children so the model's own bounding-box center sits at the
    // group's local origin — otherwise the pivot the camera orbits/zooms
    // around doesn't match the aircraft's visual center.
    const inner = new THREE.Group();
    [...g.children].forEach(c=>inner.add(c));
    const box = new THREE.Box3().setFromObject(inner);
    const center = box.getCenter(new THREE.Vector3());
    inner.position.sub(center);
    g.add(inner);
    g.scale.setScalar(scale);
    return g;
  }

  function buildAircraft(){
    const g = new THREE.Group();
    const body = 0x2f7690, bodyLite = 0x3f8ba6, dark = 0x0f1c1f, canopy = 0x3fc8ff;

    // fuselage — three tapered segments in a straight line read as one smooth,
    // pointed body: sharp nose -> full-width midbody -> tapered tail
    const nose = cone(0.095,0.55,body); nose.position.x = 0.475; g.add(nose);
    const mid  = cyl(0.095,0.095,0.55,body); mid.position.x = -0.075; g.add(mid);
    const tail = cyl(0.095,0.03,0.45,body); tail.position.x = -0.575; g.add(tail);
    const nozzle = cyl(0.032,0.045,0.14,dark); nozzle.position.x = -0.865; g.add(nozzle);
    const pitot = cyl(0.006,0.006,0.14,dark); pitot.position.x = 0.75+0.07; g.add(pitot);

    // bubble canopy — sunk into the spine so only the dome pokes through,
    // instead of a sphere sitting on top with a gap underneath
    const cab = new THREE.Mesh(
      new THREE.SphereGeometry(0.09,14,10),
      new THREE.MeshStandardMaterial({color:canopy, emissive:0x1a5f75, emissiveIntensity:1.0})
    );
    cab.scale.set(1.7,0.85,0.8);
    cab.position.set(0.15,0,0.08);
    g.add(cab);

    // side intake scoops just aft of the canopy — a strong "fighter jet" cue
    [1,-1].forEach(side=>{
      const intake = new THREE.Mesh(
        new THREE.BoxGeometry(0.24,0.07,0.09),
        new THREE.MeshStandardMaterial({color:dark, metalness:0.4, roughness:0.5})
      );
      intake.position.set(-0.04, side*0.115, -0.015);
      g.add(intake);
    });

    // single pair of swept, trapezoidal wings, mid-mounted
    [1,-1].forEach(side=>{
      g.add(quadMesh(
        [0.16,  side*0.09, 0],
        [-0.35, side*0.09, 0],
        [-0.44, side*0.74, 0],
        [-0.13, side*0.74, 0],
        body
      ));
    });

    // single centered vertical fin — root kept low enough to stay under the
    // tapering tail surface along its whole length, so it rises cleanly out
    // of the spine instead of hovering above it near the tail tip
    g.add(quadMesh(
      [-0.40, 0, 0.02], [-0.68, 0, 0.02], [-0.60, 0, 0.36], [-0.46, 0, 0.28],
      bodyLite
    ));


    // low, swept horizontal stabilizers
    [1,-1].forEach(side=>{
      g.add(quadMesh(
        [-0.56, side*0.06, -0.015],
        [-0.78, side*0.06, -0.015],
        [-0.74, side*0.30, -0.015],
        [-0.60, side*0.06+0.02, -0.015],
        bodyLite
      ));
    });

    return centerGroup(g, 1.35);
  }

  function buildAim120(){
    const g = new THREE.Group();
    const body = 0x9aa7a9, dark = 0x4d5658, band = 0xff4d4d;

    const fuse = cyl(0.032,0.032,0.58,body); g.add(fuse);
    const radome = cone(0.032,0.13,0x6b7476); radome.position.x = 0.29+0.065; g.add(radome);

    // warhead band marking
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.036,0.012,6,14),
      new THREE.MeshStandardMaterial({color:band, emissive:0x4a0d0d, emissiveIntensity:0.6})
    );
    ring.rotation.y = Math.PI/2;
    ring.position.x = 0.05;
    g.add(ring);

    // cruciform tail fins
    for(let k=0;k<4;k++){
      const fin = triMesh([-0.16,0,0.025],[-0.29,0,0.025],[-0.27,0,0.15], dark);
      fin.rotation.x = k*Math.PI/2;
      g.add(fin);
    }
    // small mid-body strakes
    for(let k=0;k<4;k++){
      const strake = triMesh([0.02,0,0.028],[-0.07,0,0.028],[-0.06,0,0.09], dark);
      strake.rotation.x = k*Math.PI/2 + Math.PI/4;
      g.add(strake);
    }

    return centerGroup(g, 1.15);
  }

  function orientToDir(obj, dir){
    obj.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), dir.clone().normalize());
  }

  // ---------------- player ----------------
  const playerColor = 0x3fc8ff;
  const aircraftModel = buildAircraft();
  scene.add(aircraftModel);
  let playerArrow = null;
  function setPlayerArrow(dir){
    if(playerArrow) scene.remove(playerArrow);
    playerArrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0,0,0), 3.1, playerColor, 0.42, 0.22);
    playerArrow.line.material.linewidth = 2;
    scene.add(playerArrow);
    orientToDir(aircraftModel, dir);
  }

  // ---------------- missiles ----------------
  const MISSILE_COLOR = 0xff4d4d;
  const MAX_MISSILES = 8;
  let missileIdSeq = 0;
  function newMissile(az, el, enabled){
    return {id:++missileIdSeq, enabled: enabled!==false, az, el, arrow:null, plane:null, planeOn:false, model:null, el_refs:null};
  }
  let missiles = [
    newMissile(-135, 20, true),
    newMissile(60,   -15, true),
    newMissile(170,  55,  false),
  ];

  function clearMissileScene(m){
    if(m.arrow){ scene.remove(m.arrow); m.arrow=null; }
    if(m.plane){ scene.remove(m.plane); m.plane=null; }
    if(m.model){ scene.remove(m.model); m.model=null; }
  }

  function rebuildMissile(m){
    clearMissileScene(m);
    if(!m.enabled) return;
    const posDir = sphToVec(m.az, m.el);      // direction FROM player TO missile's origin point
    const startPos = posDir.clone().multiplyScalar(5.0);
    const losDir = posDir.clone().negate();   // missile's line-of-sight / closing direction (toward player)
    const arrow = new THREE.ArrowHelper(losDir, startPos, 4.1, MISSILE_COLOR, 0.42, 0.22);
    scene.add(arrow);
    m.arrow = arrow;

    const aim120 = buildAim120();
    aim120.position.copy(startPos);
    orientToDir(aim120, losDir);
    scene.add(aim120);
    m.model = aim120;

    if(m.planeOn){
      const geo = new THREE.CircleGeometry(3.4, 48);
      const mat = new THREE.MeshBasicMaterial({color:0x39ffb0, transparent:true, opacity:0.10, side:THREE.DoubleSide, depthWrite:false});
      const plane = new THREE.Mesh(geo, mat);
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), losDir.clone().normalize());
      plane.setRotationFromQuaternion(q);
      const edge = new THREE.LineLoop(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({color:0x39ffb0, transparent:true, opacity:0.35})
      );
      edge.setRotationFromQuaternion(q);
      plane.add(edge);
      scene.add(plane);
      m.plane = plane;
    }
  }

  // ---------------- gauges ----------------
  function drawGauge(canvasEl, value, active){
    const ctx = canvasEl.getContext('2d');
    const W = canvasEl.width, H = canvasEl.height;
    ctx.clearRect(0,0,W,H);
    const cx = W/2, cy = H-6, r = W/2-8;

    // background arc
    ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.strokeStyle = active ? '#1c3430' : '#141d1f';
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,2*Math.PI); ctx.stroke();

    // green "notch zone" 80-100 deg
    const a1 = Math.PI*(1+80/180), a2 = Math.PI*(1+100/180);
    ctx.strokeStyle = active ? '#39ffb0' : '#1f3a34';
    ctx.globalAlpha = active ? 0.9 : 0.4;
    ctx.beginPath(); ctx.arc(cx,cy,r,a1,a2); ctx.stroke();
    ctx.globalAlpha = 1;

    if(active){
      const ang = Math.PI*(1+ (value/180));
      const nx = cx + (r-4)*Math.cos(ang), ny = cy + (r-4)*Math.sin(ang);
      const inNotch = value>=80 && value<=100;
      ctx.strokeStyle = inNotch ? '#39ffb0' : '#ff9d3f';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(nx,ny); ctx.stroke();
      ctx.fillStyle = inNotch ? '#39ffb0' : '#ff9d3f';
      ctx.beginPath(); ctx.arc(cx,cy,3,0,7); ctx.fill();
    }
  }

  // ---------------- panel wiring ----------------
  const pAz = document.getElementById('pAz'), pEl = document.getElementById('pEl');
  const pAzVal = document.getElementById('pAzVal'), pElVal = document.getElementById('pElVal');
  const missileBlocksEl = document.getElementById('missileBlocks');
  const addMissileBtn = document.getElementById('addMissileBtn');
  const threatCountEl = document.getElementById('threatCount');

  function createMissileBlockEl(m, index){
    const div = document.createElement('div');
    div.className = 'block';
    div.innerHTML = `
      <div class="block-head">
        <span class="name">THREAT ${index+1}</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <label class="switch"><input type="checkbox" class="en" ${m.enabled?'checked':''}> ARMED</label>
          <button type="button" class="del-btn" title="Remove threat">✕</button>
        </div>
      </div>
      <div class="block-body">
        <div class="block-controls">
          <div class="row"><label>Azimuth</label><input type="range" class="az" min="-180" max="180" value="${m.az}"><span class="val az-val">${m.az}°</span></div>
          <div class="row"><label>Elevation</label><input type="range" class="el" min="-89" max="89" value="${m.el}"><span class="val el-val">${m.el}°</span></div>
          <div class="planetoggle"><input type="checkbox" class="pl" ${m.planeOn?'checked':''}> SHOW NOTCH PLANE</div>
          <button type="button" class="btn mini notch-btn" style="margin-top:8px;">Auto-Notch to This ▸</button>
        </div>
        <div class="gauge-wrap">
          <canvas class="gauge" width="100" height="64"></canvas>
          <div class="gauge-status status">—</div>
          <div class="gauge-value val-text">— °</div>
        </div>
      </div>`;

    const enEl = div.querySelector('.en');
    const azEl = div.querySelector('.az');
    const elEl = div.querySelector('.el');
    const azValEl = div.querySelector('.az-val');
    const elValEl = div.querySelector('.el-val');
    const plEl = div.querySelector('.pl');
    const delBtn = div.querySelector('.del-btn');
    const notchBtn = div.querySelector('.notch-btn');

    m.el_refs = {
      gaugeCanvas: div.querySelector('.gauge'),
      statusEl: div.querySelector('.status'),
      valTextEl: div.querySelector('.val-text'),
    };

    enEl.addEventListener('change', e=>{ m.enabled=e.target.checked; refreshAll(); });
    azEl.addEventListener('input', e=>{ m.az=+e.target.value; azValEl.textContent=m.az+'°'; refreshAll(); });
    elEl.addEventListener('input', e=>{ m.el=+e.target.value; elValEl.textContent=m.el+'°'; refreshAll(); });
    plEl.addEventListener('change', e=>{ m.planeOn=e.target.checked; refreshAll(); });
    delBtn.addEventListener('click', ()=> deleteMissile(m.id));
    notchBtn.addEventListener('click', ()=>{
      if(!m.enabled) return;
      const posDir = sphToVec(m.az, m.el);
      const losDir = posDir.clone().negate();
      let ref = new THREE.Vector3(0,0,1);
      if(Math.abs(losDir.dot(ref)) > 0.98) ref = new THREE.Vector3(1,0,0);
      const perp = new THREE.Vector3().crossVectors(losDir, ref).normalize();
      const sph = vecToSph(perp);
      playerAz = sph.az; playerEl = sph.el;
      applyPlayerSliders();
      refreshAll();
    });

    return div;
  }

  function renderMissileBlocks(){
    missileBlocksEl.innerHTML = '';
    missiles.forEach((m,i)=> missileBlocksEl.appendChild(createMissileBlockEl(m,i)));
    threatCountEl.textContent = missiles.length + ' / ' + MAX_MISSILES;
    addMissileBtn.disabled = missiles.length >= MAX_MISSILES;
  }

  function addMissile(){
    if(missiles.length >= MAX_MISSILES) return;
    const k = missiles.length;
    const az = ((-150 + k*67) % 360 + 540) % 360 - 180; // spread new threats around the compass
    missiles.push(newMissile(az, 10, true));
    renderMissileBlocks();
    refreshAll();
  }

  function deleteMissile(id){
    const idx = missiles.findIndex(m=>m.id===id);
    if(idx < 0) return;
    clearMissileScene(missiles[idx]);
    missiles.splice(idx,1);
    renderMissileBlocks();
    refreshAll();
  }

  addMissileBtn.addEventListener('click', addMissile);

  // ---------------- state sync ----------------
  let playerAz = 45, playerEl = 0;

  function applyPlayerSliders(){
    pAzVal.textContent = Math.round(playerAz)+'°';
    pElVal.textContent = Math.round(playerEl)+'°';
    pAz.value = playerAz; pEl.value = playerEl;
  }

  function refreshAll(){
    const playerDir = sphToVec(playerAz, playerEl);
    setPlayerArrow(playerDir);

    missiles.forEach(m=>{
      rebuildMissile(m);
      const {gaugeCanvas, statusEl, valTextEl} = m.el_refs || {};
      if(!gaugeCanvas) return;
      if(!m.enabled){
        drawGauge(gaugeCanvas, 0, false);
        statusEl.textContent='INACTIVE'; statusEl.style.color='#3a5852';
        valTextEl.textContent='— °';
        return;
      }
      const posDir = sphToVec(m.az, m.el);
      const losDir = posDir.clone().negate();
      const angle = THREE.MathUtils.radToDeg(playerDir.angleTo(losDir));
      drawGauge(gaugeCanvas, angle, true);
      valTextEl.textContent = angle.toFixed(1)+'°  (Δ from 90° = '+Math.abs(90-angle).toFixed(1)+'°)';
      const inNotch = angle>=80 && angle<=100;
      statusEl.textContent = inNotch ? 'NOTCHED ✓' : 'OFF-AXIS';
      statusEl.style.color = inNotch ? '#39ffb0' : '#ff9d3f';
    });
  }

  pAz.addEventListener('input', ()=>{playerAz=+pAz.value; pAzVal.textContent=playerAz+'°'; refreshAll();});
  pEl.addEventListener('input', ()=>{playerEl=+pEl.value; pElVal.textContent=playerEl+'°'; refreshAll();});

  // ---------------- presets (mirroring the hand-drawn panels) ----------------
  function loadPreset(pAzDeg, pElDeg, defs){
    missiles.forEach(clearMissileScene);
    missiles = defs.map(d => newMissile(d[0], d[1], d[2] !== false));
    playerAz = pAzDeg; playerEl = pElDeg;
    renderMissileBlocks();
    syncAllUI();
  }
  document.getElementById('preset1').addEventListener('click', ()=>{
    loadPreset(135, 0, [[-25,25],[-25,-15]]);
  });
  document.getElementById('preset2').addEventListener('click', ()=>{
    loadPreset(45, 0, [[-155,18],[155,-22]]);
  });
  document.getElementById('preset3').addEventListener('click', ()=>{
    loadPreset(0, 90, [[20,0],[110,0],[-150,0]]);
  });

  function syncAllUI(){
    applyPlayerSliders();
    refreshAll();
  }

  // ---------------- boot ----------------
  renderMissileBlocks();
  resize();
  updateCamera();
  syncAllUI();

  function loop(){
    requestAnimationFrame(loop);
    renderer.render(scene, camera);
  }
  loop();
})();
</script>
</body>
</html>
